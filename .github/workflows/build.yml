name: Build iOS Volume APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install SDK platform
        run: yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Generate Android project
        run: |
          mkdir -p app/src/main/java/com/ios/volume app/src/main/res/xml app/src/main/res/values

          cat > settings.gradle <<'EOF_A'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "iOS-Volume-Pill"
          include ':app'
          EOF_A

          cat > build.gradle <<'EOF_B'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_B

          cat > gradle.properties <<'EOF_C'
          org.gradle.jvmargs=-Xmx2g
          EOF_C

          cat > app/build.gradle <<'EOF_D'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.ios.volume'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.ios.volume'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF_D

          cat > app/src/main/AndroidManifest.xml <<'EOF_E'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:icon="@android:drawable/ic_lock_silent_mode_off"
                  android:theme="@android:style/Theme.DeviceDefault.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".VolumeService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF_E

          cat > app/src/main/res/values/strings.xml <<'EOF_F'
          <resources>
              <string name="app_name">iOS Volume</string>
              <string name="desc">Replaces the volume panel with an iOS-style pill. Needs to detect volume button presses.</string>
          </resources>
          EOF_F

          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF_G'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRequestFilterKeyEvents"
              android:canRequestFilterKeyEvents="true"
              android:notificationTimeout="100"
              android:description="@string/desc" />
          EOF_G

          cat > app/src/main/java/com/ios/volume/MainActivity.java <<'EOF_H'
          package com.ios.volume;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  float d = getResources().getDisplayMetrics().density;
                  int p = (int) (24 * d);
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  l.setPadding(p, p * 2, p, p);

                  TextView t = new TextView(this);
                  t.setTextSize(16);
                  t.setText("iOS Volume Pill\n\n1. Tap the button below.\n2. Open Installed apps and choose iOS Volume.\n3. Turn it ON.\n\nIf it is greyed out: Settings > Apps > iOS Volume > three dots > Allow restricted settings.");
                  l.addView(t);

                  Button btn = new Button(this);
                  btn.setText("Open Accessibility Settings");
                  btn.setOnClickListener(v -> startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)));
                  l.addView(btn);

                  setContentView(l);
              }
          }
          EOF_H

          cat > app/src/main/java/com/ios/volume/VolumeService.java <<'EOF_I'
          package com.ios.volume;

          import android.accessibilityservice.AccessibilityService;
          import android.graphics.PixelFormat;
          import android.media.AudioManager;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.WindowManager;
          import android.view.accessibility.AccessibilityEvent;

          public class VolumeService extends AccessibilityService {
              private AudioManager am;
              private WindowManager wm;
              private PillView pill;
              private boolean attached = false;
              private int gen = 0;
              private final Handler h = new Handler(Looper.getMainLooper());

              private final Runnable thin = () -> { if (pill != null) pill.setThick(false); };

              private final Runnable hide = () -> {
                  if (pill == null || !attached) return;
                  final int g = gen;
                  pill.animate().alpha(0f).setDuration(220).withEndAction(() -> {
                      if (g == gen && attached) {
                          try { wm.removeView(pill); } catch (Exception ignored) {}
                          attached = false;
                      }
                  }).start();
              };

              @Override protected void onServiceConnected() {
                  am = (AudioManager) getSystemService(AUDIO_SERVICE);
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  pill = new PillView(this);
              }

              @Override public void onAccessibilityEvent(AccessibilityEvent e) {}
              @Override public void onInterrupt() {}

              @Override public boolean onKeyEvent(KeyEvent e) {
                  int code = e.getKeyCode();
                  if (code != KeyEvent.KEYCODE_VOLUME_UP && code != KeyEvent.KEYCODE_VOLUME_DOWN) return false;
                  if (am == null || pill == null) return false;

                  int mode = am.getMode();
                  int stream = (mode == AudioManager.MODE_IN_CALL || mode == AudioManager.MODE_IN_COMMUNICATION)
                          ? AudioManager.STREAM_VOICE_CALL : AudioManager.STREAM_MUSIC;

                  if (e.getAction() == KeyEvent.ACTION_DOWN) {
                      try {
                          // flags = 0 means the system volume panel is NOT shown
                          am.adjustStreamVolume(stream,
                                  code == KeyEvent.KEYCODE_VOLUME_UP ? AudioManager.ADJUST_RAISE : AudioManager.ADJUST_LOWER,
                                  0);
                      } catch (Exception ignored) {}
                      int max = Math.max(1, am.getStreamMaxVolume(stream));
                      show(am.getStreamVolume(stream) / (float) max);
                  } else if (e.getAction() == KeyEvent.ACTION_UP) {
                      h.removeCallbacks(thin);
                      h.removeCallbacks(hide);
                      h.postDelayed(thin, 150);
                      h.postDelayed(hide, 1800);
                  }
                  return true;
              }

              private void show(float level) {
                  gen++;
                  h.removeCallbacks(thin);
                  h.removeCallbacks(hide);
                  pill.animate().cancel();
                  pill.setAlpha(1f);
                  if (!attached) {
                      float d = getResources().getDisplayMetrics().density;
                      WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                              (int) (36 * d), (int) (240 * d),
                              WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                      | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                                      | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                                      | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                              PixelFormat.TRANSLUCENT);
                      lp.gravity = Gravity.START | Gravity.CENTER_VERTICAL;
                      lp.x = (int) (2 * d);
                      pill.reset(level);
                      try {
                          wm.addView(pill, lp);
                          attached = true;
                      } catch (Exception ignored) {}
                  }
                  pill.setLevel(level);
                  pill.setThick(true);
              }
          }
          EOF_I

          cat > app/src/main/java/com/ios/volume/PillView.java <<'EOF_J'
          package com.ios.volume;

          import android.animation.ValueAnimator;
          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.RectF;
          import android.view.View;
          import android.view.animation.DecelerateInterpolator;

          public class PillView extends View {
              private final Paint track = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint fill = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint iconFill = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint iconStroke = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final float d;
              private float t = 0f;    // 0 = thin, 1 = thick (button held)
              private float lvl = 0f;  // 0..1 volume level shown
              private ValueAnimator ta, la;

              public PillView(Context c) {
                  super(c);
                  d = c.getResources().getDisplayMetrics().density;
                  track.setColor(0x80606060);
                  fill.setColor(0xF5FFFFFF);
                  iconFill.setStyle(Paint.Style.FILL);
                  iconStroke.setStyle(Paint.Style.STROKE);
                  iconStroke.setStrokeWidth(1.6f * d);
                  iconStroke.setStrokeCap(Paint.Cap.ROUND);
              }

              public void reset(float level) {
                  if (ta != null) ta.cancel();
                  if (la != null) la.cancel();
                  t = 0f;
                  lvl = level;
                  invalidate();
              }

              public void setThick(boolean on) {
                  if (ta != null) ta.cancel();
                  ta = ValueAnimator.ofFloat(t, on ? 1f : 0f);
                  ta.setDuration(200);
                  ta.setInterpolator(new DecelerateInterpolator());
                  ta.addUpdateListener(a -> { t = (float) a.getAnimatedValue(); invalidate(); });
                  ta.start();
              }

              public void setLevel(float target) {
                  if (la != null) la.cancel();
                  la = ValueAnimator.ofFloat(lvl, target);
                  la.setDuration(120);
                  la.addUpdateListener(a -> { lvl = (float) a.getAnimatedValue(); invalidate(); });
                  la.start();
              }

              @Override protected void onDraw(Canvas c) {
                  float w = (7f + 15f * t) * d;
                  float ph = getHeight() - 8f * d;
                  RectF r = new RectF(4f * d, 4f * d, 4f * d + w, 4f * d + ph);
                  float rad = w / 2f;

                  Path clip = new Path();
                  clip.addRoundRect(r, rad, rad, Path.Direction.CW);
                  c.save();
                  c.clipPath(clip);
                  c.drawRect(r, track);
                  c.drawRect(r.left, r.bottom - ph * lvl, r.right, r.bottom, fill);
                  c.restore();

                  float k = Math.max(0f, Math.min(1f, (t - 0.5f) * 2f));
                  if (k > 0f) {
                      int a = (int) (200 * k);
                      iconFill.setColor((a << 24) | 0x3C3C43);
                      iconStroke.setColor((a << 24) | 0x3C3C43);
                      float cx = r.centerX() - 2f * d;
                      float cy = r.bottom - 16f * d;
                      Path p = new Path();
                      p.moveTo(cx - 5f * d, cy - 2f * d);
                      p.lineTo(cx - 2f * d, cy - 2f * d);
                      p.lineTo(cx + 1.5f * d, cy - 5f * d);
                      p.lineTo(cx + 1.5f * d, cy + 5f * d);
                      p.lineTo(cx - 2f * d, cy + 2f * d);
                      p.lineTo(cx - 5f * d, cy + 2f * d);
                      p.close();
                      c.drawPath(p, iconFill);
                      int waves = lvl <= 0.01f ? 0 : (lvl < 0.45f ? 1 : 2);
                      for (int i = 1; i <= waves; i++) {
                          float rr = (2.5f + 2.5f * i) * d;
                          RectF arc = new RectF(cx + 1.5f * d - rr, cy - rr, cx + 1.5f * d + rr, cy + rr);
                          c.drawArc(arc, -45f, 90f, false, iconStroke);
                      }
                  }
              }
          }
          EOF_J

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ios-volume.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ios-volume-apk
          path: ios-volume.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: iOS Volume build ${{ github.run_number }}
          files: ios-volume.apk
